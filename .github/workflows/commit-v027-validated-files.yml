name: Commit validated v0.27 source/build files

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v027-ime-ux-polish
    paths:
      - .github/workflows/commit-v027-validated-files.yml

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v027-ime-ux-polish
          fetch-depth: 0
      - name: Apply already validated patch
        run: python3 tools/patch_v027_complete_ux_build.py
      - name: Verify focused changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g = Path('app/build.gradle.kts').read_text()
          m = Path('app/src/main/java/com/ccwu/orbitime/MainActivity.kt').read_text()
          s = Path('app/src/main/java/com/ccwu/orbitime/ImeSpeechController.kt').read_text()
          v = Path('tools/validate_mature_ime_assets.py').read_text()
          assert 'create("bundledModelsDebug")' in g
          assert 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.8' in g
          assert 'setLineSpacing(dp(2).toFloat(), 1f)' in m
          assert 'executable.size != 1' in s
          assert 'official sherpa Android AAR dependency missing' in v
          print('validated file checks PASS')
          PY
          git diff --check
      - name: Commit non-workflow files
        run: |
          git config user.name "initial2024"
          git config user.email "zo46@qq.com"
          git add app/build.gradle.kts \
                  app/src/main/java/com/ccwu/orbitime/MainActivity.kt \
                  app/src/main/java/com/ccwu/orbitime/ImeSpeechController.kt \
                  tools/validate_mature_ime_assets.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete v027 dual-build voice usability repair"
          git push origin HEAD:fix/v027-ime-ux-polish
