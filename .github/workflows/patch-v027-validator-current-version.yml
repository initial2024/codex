name: Patch v0.27 validator current version

on:
  push:
    branches:
      - fix/v027-ime-usability
    paths:
      - tools/patch_v027_validator_current_version.py
      - .github/workflows/patch-v027-validator-current-version.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v027-ime-usability
      - name: Patch validator/version metadata
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/patch_v027_validator_current_version.py
      - name: Syntax and sentinel checks
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile tools/validate_mature_ime_assets.py
          grep -F '"requestMicrophonePermission", "previewTts", "confirmAndChooseVoiceReference", "previewVoiceClone"' tools/validate_mature_ime_assets.py
          ! grep -F '"previewVoiceClone", "v0.26.0"' tools/validate_mature_ime_assets.py
          grep -F 'orbit-ime-v0.27-debug-apk' tools/validate_mature_ime_assets.py
          grep -F '"version": "0.27.0"' tools/validate_mature_ime_assets.py
          grep -F 'name: orbit-ime-v0.27-debug-apk' .github/workflows/build-apk.yml
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/validate_mature_ime_assets.py .github/workflows/build-apk.yml
          git diff --cached --check
          git commit -m "fix: decouple historical feature gates from v0.26 label [v027]"
          git push origin HEAD:fix/v027-ime-usability
