name: Patch v0.27 Unicode 17 source

on:
  push:
    branches:
      - fix/v027-ime-usability
    paths:
      - tools/patch_v027_unicode17_source.py
      - .github/workflows/patch-v027-unicode17-source.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v027-ime-usability
      - name: Verify official Unicode 17 file and patch source config
        run: python3 tools/patch_v027_unicode17_source.py
      - name: Validate JSON
        run: python3 -m json.tool data/ime_sources/mature_sources.json > /dev/null
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ime_sources/mature_sources.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No config changes needed"
            exit 0
          fi
          git commit -m "fix: pin Unicode Emoji 17.0 official fixed URL [v027-data]"
          git push origin HEAD:fix/v027-ime-usability
