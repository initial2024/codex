name: Patch v0.27 manifest contract

on:
  push:
    branches:
      - fix/v027-ime-usability
    paths:
      - tools/patch_v027_manifest_contract.py
      - .github/workflows/patch-v027-manifest-contract.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v027-ime-usability
      - name: Patch manifest contract
        run: python3 tools/patch_v027_manifest_contract.py
      - name: Run v0.20 offline regression test
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/test_ime_data_pipeline_v020.py
      - name: Syntax check
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile tools/augment_v020_data.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile tools/test_ime_data_pipeline_v020.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/augment_v020_data.py tools/test_ime_data_pipeline_v020.py
          git diff --cached --check
          git commit -m "fix: align v0.20 manifest input with v0.19 producer [v027-data]"
          git push origin HEAD:fix/v027-ime-usability
