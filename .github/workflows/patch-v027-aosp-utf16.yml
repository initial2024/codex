name: Patch v0.27 AOSP UTF-16 compatibility

on:
  push:
    branches:
      - fix/v027-ime-usability
    paths:
      - tools/patch_v027_aosp_utf16.py
      - .github/workflows/patch-v027-aosp-utf16.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v027-ime-usability
      - name: Patch mature data decoder
        run: python3 tools/patch_v027_aosp_utf16.py
      - name: Syntax check
        run: python3 -m py_compile tools/prepare_mature_ime_data.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/prepare_mature_ime_data.py
          git diff --cached --check
          git commit -m "fix: decode pinned AOSP dictionary by BOM [v027-data]"
          git push origin HEAD:fix/v027-ime-usability
