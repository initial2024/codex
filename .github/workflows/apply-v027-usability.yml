name: Apply v0.27 usability patch

on:
  push:
    branches:
      - fix/v027-ime-usability
    paths:
      - tools/apply_v027_usability_patch.py
      - tools/fix_v027_patcher.py
      - .github/workflows/apply-v027-usability.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v027-ime-usability
      - name: Repair one-shot patcher
        run: python3 tools/fix_v027_patcher.py
      - name: Apply precise source patch
        run: python3 tools/apply_v027_usability_patch.py
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/com/ccwu/orbitime/MainActivity.kt app/src/main/java/com/ccwu/orbitime/OrbitInputMethodService.kt app/src/main/java/com/ccwu/orbitime/PetRepository.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "fix: v0.27 IME usability and discoverability [v027-patched]"
          git push origin HEAD:fix/v027-ime-usability
