name: Complete v0.27 UX and dual APK build

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v027-ime-ux-polish
    paths:
      - tools/patch_v027_complete_ux_build.py
      - .github/workflows/patch-v027-complete-ux-build.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/v027-ime-ux-polish
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Apply complete patch
        run: python3 tools/patch_v027_complete_ux_build.py

      - name: Static checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('app/build.gradle.kts').read_text()
          main = Path('app/src/main/java/com/ccwu/orbitime/MainActivity.kt').read_text()
          service = Path('app/src/main/java/com/ccwu/orbitime/OrbitInputMethodService.kt').read_text()
          speech = Path('app/src/main/java/com/ccwu/orbitime/ImeSpeechController.kt').read_text()
          gate = Path('app/src/main/java/com/ccwu/orbitime/ProGate.kt').read_text()
          packs = Path('app/src/main/java/com/ccwu/orbitime/ModelPackManager.kt').read_text()
          validator = Path('tools/validate_mature_ime_assets.py').read_text()
          workflow = Path('.github/workflows/build-apk.yml').read_text()
          assert 'create("bundledModelsDebug")' in gradle
          assert 'applicationIdSuffix = ".bundledmodels"' in gradle
          assert 'versionNameSuffix = "-bundled-models-test"' in gradle
          assert gradle.count('implementation("com.github.k2-fsa:sherpa-onnx:1.13.8")') == 1
          assert 'isTransitive = false' in gradle
          assert '1.13.8@aar' not in gradle
          assert 'setLineSpacing(dp(2).toFloat(), 1f)' in main
          assert 'lineSpacing = dp(2).toFloat()' not in main
          assert 'private const val CANDIDATE_UI_LIMIT = 12' in service
          assert 'private const val NEXT_SUGGESTION_LIMIT = 6' in service
          assert 'chip(label("切换", "Switch"))' not in service
          assert 'speechStatusMessage' in service
          assert 'executable.size != 1' in speech
          assert 'endsWith(".bundledmodels")' in gate
          assert 'val autoEnabled = status.executable' in packs
          assert 'bundledModelsDebug build type missing' in validator
          assert 'orbit-ime-v0.27-bundled-models-test-apk' in workflow
          print('static checks PASS')
          PY
          git diff --check

      - name: Verify task discovery
        run: |
          gradle :app:tasks --all --no-daemon | tee /tmp/tasks.txt
          grep -q 'assembleDebug' /tmp/tasks.txt
          grep -q 'assembleBundledModelsDebug' /tmp/tasks.txt

      - name: Verify sherpa runtime dependencies
        run: |
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon | tee /tmp/debug-deps.txt
          gradle :app:dependencies --configuration bundledModelsDebugRuntimeClasspath --no-daemon | tee /tmp/test-deps.txt
          ! grep -E 'sherpa-onnx-jvm|native-lib-linux|native-lib-osx|native-lib-win' /tmp/debug-deps.txt
          ! grep -E 'sherpa-onnx-jvm|native-lib-linux|native-lib-osx|native-lib-win' /tmp/test-deps.txt
          grep -q 'sherpa-onnx' /tmp/debug-deps.txt
          grep -q 'sherpa-onnx' /tmp/test-deps.txt

      - name: Duplicate class checks
        run: |
          gradle :app:checkDebugDuplicateClasses :app:checkBundledModelsDebugDuplicateClasses --no-daemon

      - name: Build both APKs with full validation
        run: gradle assembleDebug assembleBundledModelsDebug --no-daemon

      - name: Verify APK outputs
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/bundledModelsDebug/app-bundledModelsDebug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/bundledModelsDebug/app-bundledModelsDebug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/bundledModelsDebug/app-bundledModelsDebug.apk

      - name: Commit validated changes
        run: |
          git config user.name "initial2024"
          git config user.email "zo46@qq.com"
          git add app/build.gradle.kts \
                  app/src/main/java/com/ccwu/orbitime/MainActivity.kt \
                  app/src/main/java/com/ccwu/orbitime/ImeSpeechController.kt \
                  tools/validate_mature_ime_assets.py \
                  .github/workflows/build-apk.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete v027 dual-build usability repair"
          git push origin HEAD:fix/v027-ime-ux-polish
