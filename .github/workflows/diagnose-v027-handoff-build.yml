name: Diagnose v0.27 IME handoff

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v027-ime-ux-polish
    paths:
      - .github/workflows/diagnose-v027-handoff-build.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v027-ime-ux-polish
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Apply patch
        run: python3 tools/patch_v027_ime_handoff.py
      - name: Capture duplicate/preBuild failure
        shell: bash
        run: |
          set +e
          gradle :app:checkDebugDuplicateClasses :app:checkBundledModelsDebugDuplicateClasses --no-daemon --stacktrace > /tmp/handoff-build.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> /tmp/handoff-build.log
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: v027-handoff-diagnostic
          path: /tmp/handoff-build.log
