name: Diagnose v0.27 duplicate classes

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v027-ime-ux-polish
    paths:
      - .github/workflows/diagnose-v027-duplicate.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v027-ime-ux-polish
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Apply pending complete patch
        run: python3 tools/patch_v027_complete_ux_build.py
      - name: Run duplicate checks and capture output
        id: dup
        shell: bash
        run: |
          set +e
          gradle :app:checkDebugDuplicateClasses :app:checkBundledModelsDebugDuplicateClasses --no-daemon > /tmp/duplicate.log 2>&1
          code=$?
          echo "$code" > /tmp/duplicate.exit
          cat /tmp/duplicate.log
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-class-diagnostic
          path: |
            /tmp/duplicate.log
            /tmp/duplicate.exit
