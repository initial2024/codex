name: Diagnose v0.27 build

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v027-ime-ux-polish
    paths:
      - .github/workflows/diagnose-v027-build.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v027-ime-ux-polish
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Apply pending complete patch
        run: python3 tools/patch_v027_complete_ux_build.py
      - name: Capture full build output
        shell: bash
        run: |
          set +e
          gradle assembleDebug assembleBundledModelsDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
          echo $? > /tmp/build.exit
          tail -n 400 /tmp/build.log
          exit 0
      - name: Upload build diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: v027-build-diagnostic
          path: |
            /tmp/build.log
            /tmp/build.exit
