name: Normalize v0.27 Unicode source config diff

on:
  push:
    branches:
      - fix/v027-ime-usability
    paths:
      - .github/workflows/normalize-v027-unicode-config.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v027-ime-usability
          fetch-depth: 0
      - name: Restore original formatting and apply only source pin changes
        run: |
          git show origin/main:data/ime_sources/mature_sources.json > /tmp/mature_sources.json
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/mature_sources.json')
          s = p.read_text(encoding='utf-8')
          old_url = 'https://www.unicode.org/Public/emoji/17.0/emoji-test.txt'
          new_url = 'https://www.unicode.org/Public/17.0.0/emoji/emoji-test.txt'
          old_sha = '07ee0565612af5d8cf36ea7d2cd7d255429441059133c60f863e97e648ebeb29'
          new_sha = '1d8a944f88d7952f7ef7c5167fef3c67995bcae24543949710231b03a201acda'
          if s.count(old_url) != 1 or s.count(old_sha) != 1:
              raise RuntimeError('expected Unicode 17 old source pin not found exactly once in main')
          s = s.replace(old_url, new_url, 1).replace(old_sha, new_sha, 1)
          Path('data/ime_sources/mature_sources.json').write_text(s, encoding='utf-8')
          PY
          python3 -m json.tool data/ime_sources/mature_sources.json > /dev/null
          git diff --check
      - name: Commit minimal config diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ime_sources/mature_sources.json
          git commit -m "chore: minimize Unicode 17 source config diff [v027-data]"
          git push origin HEAD:fix/v027-ime-usability
